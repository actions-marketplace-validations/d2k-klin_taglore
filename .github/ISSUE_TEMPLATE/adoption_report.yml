name: Adoption report
description: You tried Taglore. Tell us what worked and what got in the way.
title: "Adoption report: "
labels: [adoption-report]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying Taglore. This takes about two minutes, and it decides what gets built next. Leave out anything private.
  - type: dropdown
    id: stage
    attributes:
      label: How far did you get?
      options:
        - Tried it locally (CLI)
        - Notes on GitHub Releases
        - What's New dialog in an app
        - Running in production for a while
        - Gave up (please tell us where)
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Stack, CI, how you version (tags, Release Please, monorepo), AI provider.
      placeholder: "Next.js app in Docker, GitHub Actions, Release Please, Copilot CLI"
  - type: textarea
    id: friction
    attributes:
      label: What got in the way
      description: The first thing that confused you, failed or took longer than it should.
    validations:
      required: true
  - type: textarea
    id: worked
    attributes:
      label: What worked well
  - type: dropdown
    id: quality
    attributes:
      label: How good were the notes?
      options:
        - Published as written
        - Small edits needed
        - Big edits needed
        - Not usable
        - Didn't get that far
  - type: input
    id: link
    attributes:
      label: Public link (optional)
      description: A repository or release where Taglore runs, if you're happy to share it.

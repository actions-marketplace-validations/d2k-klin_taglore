version: 2
updates:
  # Actions used in the workflows: weekly, in one pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # npm: security updates only (open-pull-requests-limit 0 turns off routine
  # version bumps). dist/ is committed, so every bump needs a rebuild.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix"
      prefix-development: "chore"

# Release notes baked into the Docker image, for any language.
# Add the Taglore step to your EXISTING tag workflow, before the image build.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: notes
        uses: d2k-klin/taglore@v1
        with:
          copilot-token: ${{ secrets.COPILOT_TOKEN }}
          # Any folder inside the build context. Examples:
          #   release-notes                              (copy it in your Dockerfile)
          #   public/release-notes                       (Next.js)
          #   src/main/resources/static/release-notes    (Spring Boot)
          output-dir: release-notes

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.version=${{ steps.notes.outputs.version }}

      # ... your existing deploy steps
